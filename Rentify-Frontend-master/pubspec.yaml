name: rentokpg
description: A new Flutter project.
version: 1.0.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.1
  http: ^1.2.0
  image_picker: ^1.2.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  connectivity_plus: ^5.0.2
  razorpay_flutter: ^1.3.7
  mime: ^1.0.4
  http_parser: ^4.0.2
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  sizer: ^2.0.15
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  intl: ^0.20.2
  mongo_dart: ^0.10.5
  url_launcher: ^6.2.2
  provider: ^6.1.1
  file_picker: ^10.3.6
  get: ^4.7.2
  pdf: ^3.11.3
  printing: ^5.14.2
  pdfx: ^2.9.2
  open_file: ^3.5.10
  share_plus: ^7.2.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/